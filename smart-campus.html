<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Campus Modules</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="static/css/smart-campus.css"></head><body><div class="app"><aside class="side"><div class="brand">🎓 Smart Campus<small>Intelligent student portal</small></div><div class="nav" id="nav"></div><button class="btn secondary" style="width:100%;margin-top:20px" onclick="logout()">Sign out</button></aside><main class="main"><div class="top"><div><h1 id="title">Smart Campus</h1><div class="muted" id="subtitle">Real-time academic, attendance and placement tools</div></div><div class="user" id="userBox">Loading…</div></div><div id="content"></div></main></div><script src="static/js/api.js"></script><script>
let user=null, current='overview', cache={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navFor=r=>r==='Student'?['overview','attendance','assignments','timetable','exams','placements','complaints','assistant']:r==='Faculty'?['overview','attendance','assignments','timetable','exams','results','assistant']:r==='Placement Officer'?['overview','placements','eligibility','assistant']:['overview','attendance','audit','assistant'];
const labels={overview:'Overview',attendance:'QR Attendance',assignments:'Assignments',timetable:'Timetable',exams:'Exams & Results',placements:'Placements & Resume',complaints:'Complaints',assistant:'AI Assistant',results:'Results',eligibility:'Eligibility',audit:'Security Audit'};
async function boot(){
  let serverSession=false;
  try{
    let r=await CampusAPI.request('/api/auth/me');
    user=r.user;
    serverSession=true;
  }catch(e){
    try{ user=JSON.parse(localStorage.getItem('currentUser')||'null'); }catch(_){ user=null; }
    if(!user || !user.role){
      location.href='student-login.html?next='+encodeURIComponent('smart-campus.html');
      return;
    }
  }
  document.getElementById('userBox').textContent=`${user.name||user.email} · ${user.role}`;
  document.getElementById('nav').innerHTML=navFor(user.role).map(x=>`<button id="n-${x}" onclick="show('${x}')">${labels[x]}</button>`).join('');
  if(!serverSession){
    document.getElementById('subtitle').textContent='Smart Modules · local student session';
  }
  show('overview');
}
function show(id){current=id; document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+id)?.classList.add('active');render(id)}
async function render(id){const c=document.getElementById('content'); c.innerHTML='<div class="card">Loading…</div>'; try{ if(id==='overview') return overview(c); if(id==='attendance') return attendance(c); if(id==='assignments') return assignments(c); if(id==='timetable') return timetable(c); if(id==='exams') return exams(c); if(id==='placements'||id==='eligibility') return placements(c); if(id==='complaints') return complaints(c); if(id==='assistant') return assistant(c); if(id==='results') return results(c); if(id==='audit') return audit(c)}catch(e){c.innerHTML=`<div class="card notice">${esc(e.message)}</div>`}}
async function overview(c){let cards=[];if(user.role==='Student'){const a=await CampusAPI.request('/api/smart/attendance/dashboard'), n=await CampusAPI.request('/api/notifications');cards=[['Attendance',a.overall+'%',a.overall<75?'warn':'good'],['Classes attended',a.present,''],['Classes missed',a.missed,''],['Unread notifications',(n.notifications||[]).filter(x=>!x.isRead).length,'']];}else{cards=[['Role',user.role,''],['Portal','Online','good'],['Security','Session protected','good'],['Time','Live data','']]}c.innerHTML=`<div class="hero"><h2>Welcome, ${esc(user.name)} 👋</h2><p>Everything is connected to the Flask + SQLite portal backend. Use the modules below for live data.</p></div><div class="grid">${cards.map(x=>`<div class="card stat"><div class="muted">${x[0]}</div><strong>${esc(x[1])}</strong><span class="pill ${x[2]}">${x[2]==='warn'?'Below 75%':'Live'}</span></div>`).join('')}</div><div class="two" style="margin-top:18px"><div class="card"><h3>Smart modules</h3><p class="muted">QR attendance, anti-proxy checks, assignments, timetable reminders, exam/result analytics, placements, complaints and AI portal assistant.</p><div class="toolbar"><button class="btn" onclick="show('attendance')">Open attendance</button><button class="btn secondary" onclick="show(user.role==='Student'?'assistant':'assignments')">Open tools</button></div></div><div class="card"><h3>Notifications</h3><div id="notices">Loading…</div></div></div>`; let n=await CampusAPI.request('/api/notifications');document.getElementById('notices').innerHTML=(n.notifications||[]).slice(0,5).map(x=>`<p><b>${esc(x.title)}</b><br><span class="muted">${esc(x.message)}</span></p>`).join('')||'<p class="muted">No notifications.</p>'}
async function attendance(c){if(user.role==='Student'){let a=await CampusAPI.request('/api/smart/attendance/dashboard');c.innerHTML=`<div class="card"><h2>Attendance Overview</h2><div class="grid"><div class="stat"><span class="muted">Overall</span><strong>${a.overall}%</strong></div><div class="stat"><span class="muted">Attended</span><strong>${a.present}</strong></div><div class="stat"><span class="muted">Missed</span><strong>${a.missed}</strong></div><div class="stat"><span class="muted">Required</span><strong>${a.required}%</strong></div></div>${a.overall<75?`<div class="notice" style="margin-top:16px">⚠ Low Attendance: you need ${a.classesNeeded} more attended classes to reach 75%.</div>`:''}<h3>Subject-wise</h3><div class="tablewrap"><table><tr><th>Subject</th><th>Present</th><th>Total</th><th>Attendance</th><th>Needed</th></tr>${a.subjects.map(x=>`<tr><td>${esc(x.subject)}</td><td>${x.present}</td><td>${x.total}</td><td><span class="pill ${x.percentage<75?'warn':'good'}">${x.percentage}%</span></td><td>${x.classesNeeded}</td></tr>`).join('')}</table></div><div class="toolbar" style="margin-top:16px"><a class="btn" href="scan-qr.html">Scan Attendance QR</a><a class="btn secondary" href="attendance-report.html">Attendance Report</a></div></div>`;return}c.innerHTML=`<div class="two"><div class="card"><h2>Faculty QR Attendance</h2><p class="muted">Dynamic 5-minute QR, duplicate prevention and live present count.</p><a class="btn" href="qr-attendance.html">Generate QR</a></div><div class="card"><h2>Anti-proxy controls</h2><p>Device fingerprint, optional GPS, optional college-network CIDR restriction and optional one-face presence verification are supported.</p></div></div>`}
async function assignments(c){let r=await CampusAPI.request('/api/assignments');cache.assignments=r.assignments||[];let student=user.role==='Student';c.innerHTML=`<div class="card"><div class="top"><div><h2>Assignment Management</h2><div class="muted">${student?'Submit work and track deadlines.':'Create, collect and evaluate assignments.'}</div></div>${!student?'<button class="btn" onclick="assignmentForm()">+ Create assignment</button>':''}</div><div class="three">${cache.assignments.map(a=>`<div class="card"><h3>${esc(a.title)}</h3><p class="muted">${esc(a.subject)} · Due ${esc(a.dueAt)}</p><p>${esc(a.description)}</p>${a.hasAttachment?`<a href="/api/assignments/${a.id}/file">Download attachment</a>`:''}<p>${student?(a.submissionId?`<span class="pill good">${esc(a.submissionStatus||'Submitted')}</span> ${a.marks!=null?a.marks+'/'+a.maxMarks:''}`:`<span class="pill warn">Pending</span>`):''}</p>${student?`<button class="btn" onclick="submitAssignment(${a.id})">${a.submissionId?'Resubmit':'Submit'}</button>`:''}</div>`).join('')||'<div class="card">No assignments.</div>'}</div></div>`}
function assignmentForm(){document.getElementById('content').innerHTML=`<div class="card"><h2>Create Assignment</h2><form onsubmit="createAssignment(event)"><div class="formgrid"><div><label>Title</label><input name="title" required></div><div><label>Class (e.g. CSE-A)</label><input name="className" value="${esc(user.assignedClass||'')}" required></div><div><label>Subject</label><input name="subject" value="${esc(user.subject||'')}" required></div><div><label>Deadline</label><input name="dueAt" type="datetime-local" required></div><div><label>Max marks</label><input name="maxMarks" type="number" value="100"></div><div><label>PDF/file</label><input name="file" type="file"></div></div><label>Description</label><textarea name="description" rows="4"></textarea><div class="toolbar"><button class="btn">Create</button><button type="button" class="btn secondary" onclick="show('assignments')">Cancel</button></div></form></div>`}
async function createAssignment(e){e.preventDefault();let f=new FormData(e.target);await CampusAPI.request('/api/assignments',{method:'POST',body:f});alert('Assignment created and students notified.');show('assignments')}
async function submitAssignment(id){let content=prompt('Enter submission text (you can also attach a file):','');let f=new FormData();f.append('content',content||'');let fileInput=document.createElement('input');fileInput.type='file';fileInput.onchange=async()=>{if(fileInput.files[0])f.append('file',fileInput.files[0]);await CampusAPI.request('/api/assignments/'+id+'/submit',{method:'POST',body:f});alert('Assignment submitted.');show('assignments')};fileInput.click()}
async function timetable(c){let r=await CampusAPI.request('/api/timetable');let days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];c.innerHTML=`<div class="card"><div class="top"><div><h2>Timetable</h2><p class="muted">Automatic reminder checks run while this page is open.</p></div>${user.role!=='Student'?'<button class="btn" onclick="timetableForm()">+ Add class</button>':''}</div><div class="tablewrap"><table><tr><th>Day</th><th>Time</th><th>Subject</th><th>Room</th><th>Faculty</th>${user.role!=='Student'?'<th></th>':''}</tr>${r.timetable.map(x=>`<tr><td>${esc(x.day)}</td><td>${x.startTime}-${x.endTime}</td><td>${esc(x.subject)}</td><td>${esc(x.room)}</td><td>${esc(x.faculty)}</td>${user.role!=='Student'?`<td><button class="btn bad" onclick="delTime(${x.id})">Delete</button></td>`:''}</tr>`).join('')}</table></div></div>`; if(user.role==='Student') reminder(r.timetable)}
function timetableForm(){document.getElementById('content').innerHTML=`<div class="card"><h2>Add Timetable Entry</h2><form onsubmit="createTime(event)"><div class="formgrid"><input name="className" placeholder="Class e.g. CSE-A" required><select name="day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select><input name="startTime" type="time" required><input name="endTime" type="time" required><input name="subject" placeholder="Subject" required><input name="room" placeholder="Room"></div><button class="btn">Save</button></form></div>`}
async function createTime(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));await CampusAPI.request('/api/timetable',{method:'POST',body:o});show('timetable')};async function delTime(id){await CampusAPI.request('/api/timetable/'+id,{method:'DELETE'});show('timetable')}
function reminder(items){let now=new Date();let day=now.toLocaleDateString('en-US',{weekday:'long'});let next=items.find(x=>x.day===day);if(next){let [h,m]=next.startTime.split(':').map(Number), t=new Date();t.setHours(h,m,0,0);let diff=(t-now)/60000;if(diff>=0&&diff<=30)alert(`Class reminder: ${next.subject} starts in ${Math.round(diff)} minutes${next.room?' in '+next.room:''}.`)}}
async function exams(c){let [e,r]=await Promise.all([CampusAPI.request('/api/exams'),user.role==='Student'?CampusAPI.request('/api/results/academic-summary'):CampusAPI.request('/api/results')]);c.innerHTML=`<div class="two"><div class="card"><h2>Exam Schedule</h2><div class="tablewrap"><table><tr><th>Exam</th><th>Subject</th><th>Date</th><th>Time</th><th>Room</th></tr>${e.exams.map(x=>`<tr><td>${esc(x.examName)}</td><td>${esc(x.subject)}</td><td>${x.date}</td><td>${x.startTime}</td><td>${esc(x.room)}</td></tr>`).join('')||'<tr><td colspan=5>No exams.</td></tr>'}</table></div>${user.role!=='Student'?'<button class="btn" onclick="examForm()">+ Schedule exam</button>':''}</div><div class="card"><h2>${user.role==='Student'?'Academic Analytics':'Published Results'}</h2>${user.role==='Student'?`<div class="grid"><div class="stat"><span class="muted">Average</span><strong>${r.averagePercentage}%</strong></div><div class="stat"><span class="muted">GPA</span><strong>${r.gpa}</strong></div></div><div class="tablewrap"><table><tr><th>Subject</th><th>%</th><th>Grade</th></tr>${r.subjects.map(x=>`<tr><td>${esc(x.subject)}</td><td>${x.percentage}</td><td>${x.grade}</td></tr>`).join('')}</table></div>`:`<div class="tablewrap"><table><tr><th>Student</th><th>Exam</th><th>Subject</th><th>%</th></tr>${r.results.slice(0,30).map(x=>`<tr><td>${esc(x.studentName)}</td><td>${esc(x.examName)}</td><td>${esc(x.subject)}</td><td>${x.percentage}%</td></tr>`).join('')}</table></div>`}</div></div>`}
function examForm(){document.getElementById('content').innerHTML=`<div class="card"><h2>Schedule Exam</h2><form onsubmit="createExam(event)"><div class="formgrid"><input name="className" placeholder="Class" required><input name="subject" placeholder="Subject" required><input name="examName" placeholder="Exam name" required><input name="date" type="date" required><input name="startTime" type="time"><input name="endTime" type="time"><input name="room" placeholder="Room"><input name="totalMarks" type="number" value="100"></div><button class="btn">Schedule</button></form></div>`};async function createExam(e){e.preventDefault();await CampusAPI.request('/api/exams',{method:'POST',body:Object.fromEntries(new FormData(e.target))});alert('Exam scheduled.');show('exams')}
async function results(c){let r=await CampusAPI.request('/api/results/academic-summary');c.innerHTML=`<div class="card"><h2>Result Analytics</h2><div class="grid"><div class="stat"><span class="muted">Average</span><strong>${r.averagePercentage}%</strong></div><div class="stat"><span class="muted">GPA</span><strong>${r.gpa}</strong></div><div class="stat"><span class="muted">CGPA</span><strong>${r.cgpa}</strong></div></div><p class="muted">Published internal/external/assignment/attendance components can be entered through the existing faculty result system; this view summarizes published records.</p></div>`}
async function placements(c){if(user.role==='Student'){let [p,e,res]=await Promise.all([CampusAPI.request('/api/placements'),CampusAPI.request('/api/placements/eligibility'),CampusAPI.request('/api/resume')]);cache.resume=res.resume||{};c.innerHTML=`<div class="two"><div class="card"><h2>Placement Drives</h2>${p.drives.map(d=>`<div class="card"><b>${esc(d.company)} — ${esc(d.title)}</b><p class="muted">${esc(d.description)} · ${d.packageLpa||'-'} LPA</p><span class="pill ${e.eligibility.find(x=>x.driveId===d.id)?.eligible?'good':'warn'}">${e.eligibility.find(x=>x.driveId===d.id)?.eligible?'Eligible':'Check eligibility'}</span> ${d.registered?'Registered':`<button class="btn" onclick="registerDrive(${d.id})">Register</button>`}</div>`).join('')||'No drives.'}</div><div class="card"><h2>Resume Builder</h2><form onsubmit="saveResume(event)">${['headline','summary','skills','education','projects','certifications'].map(k=>`<label>${k}</label><textarea name="${k}" rows="${k==='summary'||k==='projects'?3:2}">${esc(cache.resume[k]||'')}</textarea>`).join('')}<button class="btn">Save resume</button> <a class="btn secondary" href="/api/resume/pdf">Download PDF</a></form></div></div>`}else{let e=await CampusAPI.request('/api/placements/eligibility');c.innerHTML=`<div class="card"><h2>Placement Eligibility Rules</h2><div class="tablewrap"><table><tr><th>Drive</th><th>Company</th><th>Min CGPA</th><th>Min Attendance</th><th>Departments</th></tr>${e.eligibility.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.name)}</td><td>${x.min_cgpa??'-'}</td><td>${x.min_attendance??'-'}</td><td>${esc(x.allowed_departments||'All')}</td></tr>`).join('')}</table></div></div>`}}
async function registerDrive(id){await CampusAPI.request('/api/placements/drives/'+id+'/register',{method:'POST'});alert('Registered.');show('placements')};async function saveResume(e){e.preventDefault();await CampusAPI.request('/api/resume',{method:'PUT',body:Object.fromEntries(new FormData(e.target))});alert('Resume saved.')}
async function complaints(c){if(user.role!=='Student'){c.innerHTML='<div class="card"><h2>Complaint administration</h2><p>Use the existing role dashboard to assign and resolve complaints. This smart layer adds tracking timelines and post-resolution feedback.</p></div>';return}let r=await CampusAPI.request('/api/complaints');cache.complaints=r.complaints||[];c.innerHTML=`<div class="card"><h2>Complaint Tracking</h2><div class="tablewrap"><table><tr><th>Tracking ID</th><th>Title</th><th>Status</th><th>Department</th><th>Timeline</th></tr>${cache.complaints.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.title)}</td><td><span class="pill">${esc(x.status)}</span></td><td>${esc(x.department)}</td><td><button class="btn secondary" onclick="timeline('${esc(x.id)}')">View</button></td></tr>`).join('')||'<tr><td colspan=5>No complaints.</td></tr>'}</table></div></div>`}
async function timeline(id){let r=await CampusAPI.request('/api/complaints/'+encodeURIComponent(id)+'/timeline');alert(r.timeline.map(x=>`${x.createdAt} — ${x.status} — ${x.note||'Updated'}`).join('\n')||'No timeline yet.')}
async function assistant(c){c.innerHTML=`<div class="card"><h2>🤖 AI Campus Assistant</h2><p class="muted">This built-in assistant answers from your portal data; it does not invent records.</p><div class="chat" id="chat"><div class="msg ai">Ask me about the data available to your role — attendance, assignments, exams, results, placements, complaints or campus summaries.</div></div><form onsubmit="ask(event)" class="toolbar" style="margin-top:12px"><input id="q" placeholder="Ask about your campus data…" required><button class="btn">Ask</button></form></div>`}
async function ask(e){e.preventDefault();let q=document.getElementById('q'), chat=document.getElementById('chat');chat.innerHTML+=`<div class="msg user">${esc(q.value)}</div>`;let r=await CampusAPI.request('/api/ai/assistant',{method:'POST',body:{message:q.value}});chat.innerHTML+=`<div class="msg ai">${esc(r.answer)}</div>`;chat.scrollTop=chat.scrollHeight;q.value=''}
async function audit(c){let [a,h]=await Promise.all([CampusAPI.request('/api/smart/audit'),CampusAPI.request('/api/smart/health')]);c.innerHTML=`<div class="grid">${Object.entries(h).map(([k,v])=>`<div class="card stat"><span class="muted">${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div><div class="card" style="margin-top:18px"><h2>Security audit log</h2><div class="tablewrap"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th><th>IP</th></tr>${a.logs.map(x=>`<tr><td>${x.created_at}</td><td>${esc(x.name||'System')}</td><td>${esc(x.action)}</td><td>${esc(x.entity)}</td><td>${esc(x.details)}</td><td>${esc(x.ip_address)}</td></tr>`).join('')}</table></div></div>`}
async function logout(){await CampusAPI.request('/api/auth/logout',{method:'POST'});localStorage.removeItem('currentUser');location.href='index.html'}
boot();
</script></body></html>
