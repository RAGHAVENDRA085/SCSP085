<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Result - Smart Campus Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab, #667eea, #764ba2);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            text-align: center;
            animation: scaleIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .result-icon {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounceIn 1s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .result-icon.success {
            background: linear-gradient(135deg, #23d5ab, #23a6d5);
            box-shadow: 0 10px 40px rgba(35, 213, 171, 0.4);
        }

        .result-icon.average {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            box-shadow: 0 10px 40px rgba(255, 193, 7, 0.4);
        }

        .result-icon.fail {
            background: linear-gradient(135deg, #f5576c, #f093fb);
            box-shadow: 0 10px 40px rgba(245, 87, 108, 0.4);
        }

        .result-icon i {
            font-size: 5rem;
            color: white;
        }

        .result-title {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
        }

        .result-subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(#667eea calc(var(--percentage) * 1%), #f0f0f0 0);
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: rotateIn 1s ease 0.5s both;
        }

        @keyframes rotateIn {
            from { transform: rotate(-180deg); opacity: 0; }
            to { transform: rotate(0); opacity: 1; }
        }

        .score-circle::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            background: white;
            border-radius: 50%;
        }

        .score-text {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .score-text .marks {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            display: block;
        }

        .score-text .total {
            color: #999;
            font-size: 1.2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 15px;
            animation: fadeInUp 0.6s ease both;
        }

        .stat-box:nth-child(1) { animation-delay: 0.2s; }
        .stat-box:nth-child(2) { animation-delay: 0.3s; }
        .stat-box:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stat-box i {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-box .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
        }

        .stat-box .label {
            color: #666;
            font-size: 0.9rem;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .result-card {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="result-card">
            <div class="result-icon" id="resultIcon">
                <i class="fas fa-trophy"></i>
            </div>
            <h1 class="result-title" id="resultTitle">Test Completed!</h1>
            <p class="result-subtitle" id="resultSubtitle">Great effort! Here's your performance.</p>

            <div class="score-circle" id="scoreCircle" style="--percentage: 0">
                <div class="score-text">
                    <span class="marks" id="obtainedMarks">0</span>
                    <span class="total">/ <span id="totalMarks">0</span></span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <i class="fas fa-check-circle"></i>
                    <div class="value" id="correctAnswers">0</div>
                    <div class="label">Correct</div>
                </div>
                <div class="stat-box">
                    <i class="fas fa-list-ol"></i>
                    <div class="value" id="totalQuestions">0</div>
                    <div class="label">Questions</div>
                </div>
                <div class="stat-box">
                    <i class="fas fa-percentage"></i>
                    <div class="value" id="percentage">0%</div>
                    <div class="label">Score</div>
                </div>
            </div>

            <div>
                <button class="btn btn-primary" onclick="window.location.href='student-profile.html'">
                    <i class="fas fa-home"></i> Back to Profile
                </button>
                <button class="btn btn-secondary" onclick="window.location.href='test-interface.html'">
                    <i class="fas fa-redo"></i> Retake Test
                </button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const result = JSON.parse(localStorage.getItem('currentResult'));
            
            if (!result) {
                alert('No test result found!');
                window.location.href = 'student-profile.html';
                return;
            }

            // Update UI
            document.getElementById('obtainedMarks').textContent = result.obtainedMarks;
            document.getElementById('totalMarks').textContent = result.totalMarks;
            document.getElementById('correctAnswers').textContent = result.correct;
            document.getElementById('totalQuestions').textContent = result.totalQuestions;
            document.getElementById('percentage').textContent = result.percentage + '%';

            // Update circle progress
            setTimeout(() => {
                document.getElementById('scoreCircle').style.setProperty('--percentage', result.percentage);
            }, 300);

            // Set result type (success/average/fail)
            const percentage = parseFloat(result.percentage);
            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const subtitle = document.getElementById('resultSubtitle');

            if (percentage >= 70) {
                icon.className = 'result-icon success';
                icon.innerHTML = '<i class="fas fa-trophy"></i>';
                title.textContent = 'Excellent!';
                subtitle.textContent = 'Outstanding performance! Keep it up!';
            } else if (percentage >= 40) {
                icon.className = 'result-icon average';
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                title.textContent = 'Good Job!';
                subtitle.textContent = 'You passed the test. Practice more to improve!';
            } else {
                icon.className = 'result-icon fail';
                icon.innerHTML = '<i class="fas fa-book-reader"></i>';
                title.textContent = 'Keep Learning!';
                subtitle.textContent = 'Don\'t worry! Practice makes perfect.';
            }
        };
    </script>
</body>
</html>
