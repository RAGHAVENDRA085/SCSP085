<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan Attendance QR</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><link rel="stylesheet" href="static/css/smart-campus.css"></head><body><main class="main" style="max-width:800px"><div class="top"><div><h1>Attendance Scanner</h1><div class="muted">Scan a faculty QR or open a token link from the QR.</div></div><a class="btn secondary" href="smart-campus.html">Smart Campus</a></div><div class="card"><div id="result" class="notice">Checking login…</div><div id="reader" style="margin-top:16px"></div><div class="toolbar" style="margin-top:16px"><button class="btn" onclick="startScan()">Start camera scanner</button></div></div></main><script src="static/js/api.js"></script><script>
const result=document.getElementById('result');const params=new URLSearchParams(location.search);let token=params.get('token');
function fingerprint(){let s=[navigator.userAgent,navigator.platform,screen.width,screen.height,Intl.DateTimeFormat().resolvedOptions().timeZone,navigator.language].join('|');let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return 'd'+Math.abs(h).toString(36)}
async function mark(t){token=t||token;if(!token){result.className='notice';result.textContent='No QR token found. Scan a QR to continue.';return}let body={token,deviceHash:fingerprint()};try{await new Promise(resolve=>{if(!navigator.geolocation)return resolve();navigator.geolocation.getCurrentPosition(p=>{body.latitude=p.coords.latitude;body.longitude=p.coords.longitude;body.accuracy=p.coords.accuracy;resolve()},()=>resolve(),{enableHighAccuracy:true,timeout:4000})});let r=await CampusAPI.request('/api/attendance/scan',{method:'POST',body});result.className='success';result.textContent=r.status==='Already Marked'?'Already Marked — attendance was already recorded.':`Present ✓ — ${r.subject} attendance marked (${r.verification||'basic'}).`;}catch(e){result.className='notice';result.textContent=e.message;if(e.status===401)setTimeout(()=>location.href='student-login.html?next='+encodeURIComponent(location.pathname+'?token='+token),700)}}
async function startScan(){if(typeof Html5Qrcode==='undefined')return alert('QR scanner library did not load. Check internet connection.');const scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:250},async decoded=>{await scanner.stop();await mark(decoded)},()=>{})}
(async()=>{try{let r=await CampusAPI.request('/api/auth/me');if(r.user.role!=='Student')throw new Error('Please sign in as a student.');if(token)await mark(token);else result.textContent='Ready. Use the camera scanner below.'}catch(e){result.textContent=e.message; if(e.status===401)setTimeout(()=>location.href='student-login.html',700)}})();
</script></body></html>
