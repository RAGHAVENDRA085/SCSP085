<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Smart Campus Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab, #667eea, #764ba2);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: particleFloat 20s infinite;
        }

        @keyframes particleFloat {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: morph 20s infinite ease-in-out;
            z-index: 0;
        }

        .blob-1 { width: 400px; height: 400px; background: rgba(102, 126, 234, 0.6); top: -100px; left: -100px; }
        .blob-2 { width: 300px; height: 300px; background: rgba(231, 60, 126, 0.6); bottom: -50px; right: -50px; animation-delay: -5s; }
        .blob-3 { width: 350px; height: 350px; background: rgba(35, 213, 171, 0.6); top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -10s; }

        @keyframes morph {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }

        .container {
            position: relative;
            z-index: 10;
            perspective: 1000px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .profile-card {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: cardEntry 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 900px;
            width: 100%;
            height: auto;
            margin: 20px 0;
        }

        @keyframes cardEntry {
            0% { opacity: 0; transform: translateY(100px) rotateX(-20deg) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) rotateX(0) scale(1); }
        }

        .profile-header { text-align: center; margin-bottom: 40px; animation: fadeInDown 0.8s ease 0.3s both; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, #667eea, #f093fb, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoPulse 3s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 10px;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .profile-header h1 { font-size: 2rem; color: #333; margin-bottom: 5px; }
        .profile-header p { color: #666; font-size: 1rem; }

        .photo-section { display: flex; justify-content: center; margin-bottom: 40px; animation: fadeInUp 0.8s ease 0.5s both; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .photo-upload {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 5px solid #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
        }

        .photo-upload:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.5);
            border-color: #f093fb;
        }

        .photo-upload img { width: 100%; height: 100%; object-fit: cover; }
        .photo-upload input[type="file"] {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 8px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .photo-upload:hover input[type="file"] { opacity: 1; }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        .form-group { position: relative; animation: slideInLeft 0.6s ease both; }
        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        .form-group:nth-child(6) { animation-delay: 0.6s; }
        .form-group:nth-child(7) { animation-delay: 0.7s; }
        .form-group:nth-child(8) { animation-delay: 0.8s; }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
        }

        .form-group label i { color: #667eea; }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            background: #f9f9f9;
            color: #333;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            transform: translateY(-3px);
        }

        .form-group textarea { min-height: 100px; resize: vertical; }
        .form-group.full-width { grid-column: 1 / -1; }

        .button-group {
            grid-column: 1 / -1;
            display: flex;
            gap: 20px;
            margin-top: 20px;
            animation: slideInLeft 0.6s ease 1s both;
        }

        .btn {
            flex: 1;
            padding: 16px 30px;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-back:hover {
            background: #667eea;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-save:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.6);
        }

        .success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .success-modal.show { display: flex; animation: fadeIn 0.3s ease; }

        .success-content {
            background: white;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            animation: successPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes successPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        .success-icon i { font-size: 3rem; color: white; }
        .success-content h2 { color: #333; font-size: 1.8rem; margin-bottom: 10px; }
        .success-content p { color: #666; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 768px) {
            .profile-card { padding: 30px 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .button-group { flex-direction: column; }
        }
    </style>
    <script src="static/js/api.js"></script>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="profile-card" id="profileCard">
            <div class="profile-header">
                <i class="fas fa-graduation-cap logo-icon"></i>
                <h1>Student Profile</h1>
                <p>Smart Campus Complaint Portal</p>
            </div>

            <div class="photo-section">
                <div class="photo-upload">
                    <img src="https://via.placeholder.com/180" alt="Profile Photo" id="profilePhoto">
                    <input type="file" accept="image/*" onchange="updatePhoto(event)">
                </div>
            </div>

            <form id="profileForm" onsubmit="saveProfile(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="fullName" value="Suma" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-id-card"></i> USN</label>
                        <input type="text" id="usn" value="1MS21CS001" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-code-branch"></i> Branch</label>
                        <select id="branch" required>
                            <option value="">Select Branch</option>
                            <option value="CSE" selected>Computer Science</option>
                            <option value="ISE">Information Science</option>
                            <option value="ECE">Electronics</option>
                            <option value="EEE">Electrical</option>
                            <option value="ME">Mechanical</option>
                            <option value="CV">Civil</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-graduation-cap"></i> CGPA</label>
                        <input type="number" id="cgpa" step="0.01" min="0" max="10" value="9.00" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="tel" id="phone" pattern="[0-9]{10}" value="9876543219" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar"></i> Date of Birth</label>
                        <input type="date" id="dob" value="2006-12-01" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-layer-group"></i> Semester</label>
                        <select id="semester" required>
                            <option value="">Select Semester</option>
                            <option value="1">1st Semester</option>
                            <option value="2">2nd Semester</option>
                            <option value="3">3rd Semester</option>
                            <option value="4">4th Semester</option>
                            <option value="5" selected>5th Semester</option>
                            <option value="6">6th Semester</option>
                            <option value="7">7th Semester</option>
                            <option value="8">8th Semester</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" value="suma123@gmail.com" required>
                    </div>
                    <div class="form-group full-width">
                        <label><i class="fas fa-home"></i> Address</label>
                        <textarea id="address" rows="3" required>sivanagar,badvel,kadapa,Andhra Pradesh</textarea>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn btn-back" onclick="goBack()">
                            <i class="fas fa-arrow-left"></i>
                            <span>Back to Login</span>
                        </button>
                        <button type="submit" class="btn btn-save">
                            <i class="fas fa-save"></i>
                            <span>Save Profile</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="success-modal" id="successModal">
        <div class="success-content">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h2>Profile Saved!</h2>
            <p>Your profile has been updated successfully.</p>
            <p style="margin-top: 15px; color: #999; font-size: 0.9rem;">Redirecting to dashboard...</p>
        </div>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 20 + 10) + 's';
                particle.style.animationDelay = Math.random() * 20 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        const card = document.getElementById('profileCard');
        const container = document.querySelector('.container');

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = (y - centerY) / 30;
            const rotateY = (centerX - x) / 30;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0) rotateY(0)';
        });

        function updatePhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profilePhoto').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // ✅ FIXED: Save profile and redirect to student dashboard
        async function saveProfile(e) {
            e.preventDefault();
            const profileData = {
                branch: document.getElementById('branch').value,
                cgpa: document.getElementById('cgpa').value,
                phone: document.getElementById('phone').value,
                dob: document.getElementById('dob').value,
                semester: document.getElementById('semester').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value
            };
            try {
                const result = await CampusAPI.request('/api/profile', {
                    method: 'PATCH',
                    body: {
                        name: document.getElementById('fullName').value.trim(),
                        profile: profileData
                    }
                });
                localStorage.setItem('currentUser', JSON.stringify(result.user));
                localStorage.setItem('studentProfile_' + result.user.email, JSON.stringify(profileData));
            } catch (error) {
                CampusAPI.reportError(error);
                return;
            }

            document.getElementById('successModal').classList.add('show');
            setTimeout(() => {
                window.location.href = 'student-dashboard.html';
            }, 2000);
        }

        function goBack() {
            window.location.href = 'student-dashboard.html';
        }

        // Check if user is logged in
        window.onload = function() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
            document.getElementById('fullName').value = currentUser.name || '';
            document.getElementById('usn').value = currentUser.usn || '';
            document.getElementById('branch').value = currentUser.department || '';
            document.getElementById('email').value = currentUser.email || '';
            document.getElementById('usn').readOnly = true;
            document.getElementById('email').readOnly = true;
            document.getElementById('branch').disabled = true;
        };
    </script>
</body>
</html>
