<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Campus Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(-45deg, #f093fb, #f5576c, #ee7752);
            background-size: 400% 400%; animation: gradientShift 15s ease infinite;
            padding: 20px; overflow-x: hidden;
        }
        @keyframes gradientShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .particle { position: absolute; width: 4px; height: 4px; background: rgba(255,255,255,0.5); border-radius: 50%; animation: particleFloat 20s infinite; }
        @keyframes particleFloat { 0%,100%{transform:translateY(100vh);opacity:0;} 10%,90%{opacity:1;} 100%{transform:translateY(-100vh);opacity:0;} }
        .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.6; animation: morph 20s infinite; z-index: 0; }
        .blob-1 { width: 400px; height: 400px; background: rgba(240,147,251,0.6); top: -100px; left: -100px; }
        .blob-2 { width: 300px; height: 300px; background: rgba(245,87,108,0.6); bottom: -50px; right: -50px; animation-delay: -5s; }
        @keyframes morph { 0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%;} 50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%;} }
        .card {
            position: relative; z-index: 10; background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px); border-radius: 30px; padding: 50px 40px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3); max-width: 450px; width: 100%;
            animation: cardEntry 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(245,87,108,0.3);
        }
        @keyframes cardEntry { 0%{opacity:0;transform:translateY(100px) scale(0.8);} 100%{opacity:1;transform:translateY(0) scale(1);} }
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #f5576c; text-decoration: none; font-weight: 600; margin-bottom: 20px; transition: all 0.3s ease; }
        .back-link:hover { transform: translateX(-5px); }
        .logo-icon {
            font-size: 4rem; text-align: center; display: block; margin-bottom: 15px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
        .title { text-align: center; margin-bottom: 30px; }
        .title h1 { color: #333; font-size: 1.8rem; margin-bottom: 5px; }
        .title p { color: #666; font-size: 0.95rem; }
        .role-badge { display: inline-block; background: linear-gradient(135deg, #f093fb, #f5576c); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 20px; }
        .security-notice {
            background: rgba(245,87,108,0.1); border-left: 4px solid #f5576c;
            padding: 12px 15px; border-radius: 8px; margin-bottom: 20px;
            color: #666; font-size: 0.85rem;
        }
        .security-notice i { color: #f5576c; margin-right: 8px; }
        .input-group { position: relative; margin-bottom: 25px; }
        .input-group input { width: 100%; padding: 15px 15px 15px 50px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 1rem; outline: none; transition: all 0.3s ease; background: #f9f9f9; color: #333; }
        .input-group input:focus { border-color: #f5576c; background: white; box-shadow: 0 0 0 4px rgba(245,87,108,0.15); transform: translateY(-2px); }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #999; transition: all 0.3s ease; }
        .input-group input:focus ~ i { color: #f5576c; transform: translateY(-50%) scale(1.2); }
        .input-group label { position: absolute; left: 50px; top: 50%; transform: translateY(-50%); color: #999; pointer-events: none; transition: all 0.3s ease; background: transparent; padding: 0 5px; }
        .input-group input:focus ~ label, .input-group input:not(:placeholder-shown) ~ label { top: -10px; left: 15px; font-size: 0.8rem; color: #f5576c; background: white; padding: 3px 10px; border-radius: 20px; }
        .submit-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #f093fb, #f5576c); color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(245,87,108,0.4); }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(245,87,108,0.6); }
        .extra-links { text-align: center; margin-top: 20px; color: #666; }
        .extra-links a { color: #f5576c; text-decoration: none; font-weight: 600; }
        .success-checkmark { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; text-align: center; }
        .success-checkmark.show { display: block; animation: successPop 0.6s cubic-bezier(0.68,-0.55,0.265,1.55); }
        @keyframes successPop { 0%{transform:translate(-50%,-50%) scale(0);} 50%{transform:translate(-50%,-50%) scale(1.2);} 100%{transform:translate(-50%,-50%) scale(1);} }
        .checkmark-circle { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #f093fb, #f5576c); display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; }
        .checkmark { width: 50px; height: 50px; border: 4px solid white; border-top: none; border-right: none; transform: rotate(-45deg); animation: checkmarkDraw 0.6s ease 0.3s both; }
        @keyframes checkmarkDraw { 0%{width:0;height:0;opacity:0;} 100%{width:50px;height:50px;opacity:1;} }
        .success-text { color: white; font-size: 1.5rem; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
    </style>
<script src="static/js/api.js"></script></head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="particles" id="particles"></div>

    <div class="card">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <i class="fas fa-user-shield logo-icon"></i>
        <div class="title">
            <h1>Admin Login</h1>
            <p>System administrator access</p>
        </div>
        <div style="text-align:center;"><span class="role-badge"><i class="fas fa-user-shield"></i> Admin Portal</span></div>

        <div class="security-notice">
            <i class="fas fa-shield-alt"></i>
            <strong>Secure Access:</strong> This area is restricted to authorized administrators only.
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <input type="email" id="email" placeholder=" " required>
                <i class="fas fa-envelope"></i>
                <label>Admin Email</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder=" " required>
                <i class="fas fa-lock"></i>
                <label>Password</label>
            </div>
            <div class="input-group">
                <input type="text" id="adminKey" placeholder=" " required>
                <i class="fas fa-key"></i>
                <label>Admin Secret Key</label>
            </div>
            <button type="submit" class="submit-btn"><i class="fas fa-shield-alt"></i> Secure Login</button>
        </form>

        <div class="extra-links">
            <p><a href="#">Forgot Password?</a></p>
            <p style="margin-top:10px; font-size: 0.85rem;"><i class="fas fa-lock"></i> Protected by 256-bit encryption</p>
        </div>
    </div>

    <div class="success-checkmark" id="successCheckmark">
        <div class="checkmark-circle"><div class="checkmark"></div></div>
        <p class="success-text">Login Successful!</p>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 20 + 10) + 's';
                p.style.animationDelay = Math.random() * 20 + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const adminKey = document.getElementById('adminKey').value;
            if (!email || !password || !adminKey) { alert('Please fill all fields!'); return; }
            try {
                await CampusAPI.request('/api/auth/login', {
                    method: 'POST',
                    body: { email, password, role: 'Admin', adminKey }
                });
                document.getElementById('successCheckmark').classList.add('show');
                setTimeout(() => window.location.href = 'admin-dashboard.html', 700);
            } catch (error) {
                alert(error.message || 'Login failed. Please check your credentials and administrator key.');
            }
        }
    </script>
</body>
</html>
